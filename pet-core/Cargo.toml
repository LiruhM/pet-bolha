[package]
name = "pet-core"
version = "0.1.0"
edition = "2021"
description = "Core logic for Pet Bolha - state machine, memory, neural engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiruhM/pet-bolha"
readme = "README.md"
categories = ["simulation", "embedded"]
keywords = ["pet", "companion", "desktop", "offline"]

[lib]
name = "pet_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["serde", "v4"] }
dirs = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Neural engine (LIF - Leaky Integrate-and-Fire)
nalgebra = { version = "0.32", features = ["serde"] }
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"
directories = "5.0"

[dev-dependencies]
tempfile = "3.0"