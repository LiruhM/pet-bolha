[package]
name = "pet-core"
version = "0.1.0"
edition = "2021"
description = "Core logic for Pet Bolha - state machine, memory, neural engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matheus/pet-bolha"
readme = "README.md"
categories = ["simulation", "embedded"]
keywords = ["pet", "companion", "desktop", "offline"]

[lib]
name = "pet_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Neural engine (LIF - Leaky Integrate-and-Fire)
nalgebra = "0.32"
rand = "0.8"
rand_distr = "0.4"